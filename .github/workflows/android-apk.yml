name: Android debug APK

on:
  push:
    branches: [arena/3cbc491e-temporary6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS dependencies
        run: npm ci

      - name: Fetch real OpenStreetMap buildings and roads
        id: fetch
        # Overpass can be slow or busy. If the fetch fails, the APK still builds with the procedural city.
        continue-on-error: true
        timeout-minutes: 25
        run: npm run fetch:osm

      - name: Report map data source
        if: always()
        run: |
          if [ -s public/data/bahrain-osm.json ]; then
            MSG="Map data: OpenStreetMap extract ($(du -h public/data/bahrain-osm.json | cut -f1))"
          else
            MSG="Map data: PROCEDURAL CITY (OSM fetch failed: ${{ steps.fetch.outcome }}). See the fetch step log."
          fi
          echo "$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests
        run: npm test

      - name: Build web app and sync into Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bahrain-3d-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
