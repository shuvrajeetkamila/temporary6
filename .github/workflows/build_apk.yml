name: Build Bahrain Android APK

on:
  push:
    branches:
      - 'arena/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Country Identity Lint
        run: |
          python3 tools/country_identity_lint.py

      - name: Verify Geodata Manifests
        run: |
          python3 tools/build_geodata_manifests.py

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Run Core Subsystem Tests
        run: |
          set -o pipefail
          ./gradlew :core:test --info --stacktrace 2>&1 | tee test_output.log || {
            mkdir -p artifacts
            echo "=== CORE TEST FAILURE LOG ===" > artifacts/failure_diagnostics.txt
            tail -n 150 test_output.log >> artifacts/failure_diagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add artifacts/failure_diagnostics.txt
            git commit -m "diagnostics: test failure log [skip ci]"
            git push origin arena/f4abc217-temporary6
            exit 1
          }

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          ./gradlew :android:assembleDebug --info --stacktrace 2>&1 | tee build_output.log || {
            mkdir -p artifacts
            echo "=== ANDROID BUILD FAILURE LOG ===" > artifacts/failure_diagnostics.txt
            tail -n 150 build_output.log >> artifacts/failure_diagnostics.txt
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add artifacts/failure_diagnostics.txt
            git commit -m "diagnostics: build failure log [skip ci]"
            git push origin arena/f4abc217-temporary6
            exit 1
          }

      - name: Stage Universal APK and Checksums
        run: |
          mkdir -p artifacts
          cp android/build/outputs/apk/debug/android-debug.apk artifacts/Bahrain-The-Island-Kingdom-EXTREME-DETAIL-v1.0.0.apk
          sha256sum artifacts/Bahrain-The-Island-Kingdom-EXTREME-DETAIL-v1.0.0.apk > artifacts/Bahrain-The-Island-Kingdom-EXTREME-DETAIL-v1.0.0.apk.sha256
          sha256sum artifacts/Bahrain-The-Island-Kingdom-EXTREME-DETAIL-v1.0.0.apk > SHA256SUMS
          cp SHA256SUMS artifacts/

      - name: Verify Staged APK Package
        run: |
          python3 tools/verify_apk.py artifacts/Bahrain-The-Island-Kingdom-EXTREME-DETAIL-v1.0.0.apk

      - name: Commit Staged APK and Reports to Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/ SHA256SUMS
          git commit -m "Build: Release Bahrain APK v1.0.0 and verification reports [skip ci]" || echo "No changes to commit"
          git push origin arena/f4abc217-temporary6

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bahrain-The-Island-Kingdom-v1.0.0-APK
          path: artifacts/*
