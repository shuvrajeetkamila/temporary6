name: Build Bahrain Android APK

on:
  push:
    branches:
      - 'arena/**'
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Country Identity Lint
        run: |
          python3 tools/country_identity_lint.py

      - name: Verify Geodata Manifests
        run: |
          python3 tools/build_geodata_manifests.py

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Dump Dependency Diagnostics
        run: |
          mkdir -p artifacts
          ./gradlew :core:dependencies --configuration compileClasspath > artifacts/deps.txt 2>&1 || true
          ./gradlew :core:compileJava --info --debug > artifacts/compile_debug.log 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/
          git commit -m "diagnostics: dump deps and compile debug [skip ci]"
          git push origin arena/f4abc217-temporary6
          exit 1
