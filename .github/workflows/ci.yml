name: Test Artifact
on:
  push:
    branches:
      - 'arena/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Test File
        run: |
          mkdir -p output
          echo "Test artifact content 12345" > output/test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: output/test.txt
