name: Test Git Push from Action
on:
  push:
    branches:
      - 'arena/**'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Test File and Push
        run: |
          mkdir -p artifacts
          echo "Test content from action runner" > artifacts/test_from_runner.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/test_from_runner.txt
          git commit -m "Add test file from runner [skip ci]"
          git push
