apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases/' }
}

android {
    namespace 'ai.example.bahrain.islandkingdom'
    compileSdk 34

    defaultConfig {
        applicationId "ai.example.bahrain.islandkingdom"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

configurations { natives }

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:1.12.1"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:1.12.1:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:1.12.1:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:1.12.1:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:1.12.1:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:1.12.1:natives-x86_64"
}

task copyNatives {
    doLast {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86/").mkdirs()
        file("libs/x86_64/").mkdirs()

        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.contains("arm64-v8a")) outputDir = file("libs/arm64-v8a")
            else if (jar.name.contains("armeabi-v7a")) outputDir = file("libs/armeabi-v7a")
            else if (jar.name.contains("x86_64")) outputDir = file("libs/x86_64")
            else if (jar.name.contains("x86")) outputDir = file("libs/x86")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn 'copyNatives'
}
preBuild.dependsOn 'copyNatives'
