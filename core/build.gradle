apply plugin: "java-library"

repositories {
    mavenCentral()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/releases/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/releases/' }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'com.badlogicgames.gdx:gdx:1.12.1'
    implementation 'com.badlogicgames.gdx:gdx-box2d:1.12.1'
    implementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.badlogicgames.gdx:gdx-backend-headless:1.12.1'
    testImplementation 'com.badlogicgames.gdx:gdx-platform:1.12.1:natives-desktop'
    testImplementation 'com.badlogicgames.gdx:gdx-box2d-platform:1.12.1:natives-desktop'
}

test {
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
